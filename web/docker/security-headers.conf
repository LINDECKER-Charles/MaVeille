# En-têtes repris du vhost de production (config/veille-le-ssl.conf.template),
# pour que ce qui casse la CSP casse ici avant d'atteindre le serveur.
#
# À inclure dans CHAQUE bloc `location` qui pose un `add_header` : nginx
# n'hérite pas des en-têtes du niveau parent dès qu'un enfant en déclare un.
#
# `style-src 'unsafe-inline'` : Angular émet les styles de composants et des
# attributs `style` inline. Aucun script inline, donc `script-src 'self'` tient.
add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; form-action 'self'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
