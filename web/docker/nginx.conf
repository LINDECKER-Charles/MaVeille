# Service du site prérendu, calqué sur le vhost Apache de production.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Sans ça, nginx renvoie un 301 vers une URL absolue reconstruite depuis le
    # port d'écoute interne (80) : derrière la publication `4200:80`, le
    # navigateur suivait la redirection vers http://localhost/… et échouait.
    absolute_redirect off;

    # Le prérendu produit un dossier par route (/fil/index.html…). On vise le
    # fichier directement plutôt que `$uri/`, qui déclencherait une redirection
    # vers l'URL avec barre oblique finale. Le repli sur /index.html laisse le
    # routeur Angular traiter le reste, comme le `FallbackResource` d'Apache.
    location / {
        try_files $uri $uri/index.html /index.html;
        include /etc/nginx/security-headers.conf;
    }

    # Assets hashés par le build : immuables, donc cachables sans limite.
    location ~* \.(?:js|css|woff2?|png|jpe?g|gif|svg|webp|avif|ico)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include /etc/nginx/security-headers.conf;
    }

    # Le point d'entrée du SPA ne doit jamais être mis en cache.
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/security-headers.conf;
    }

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Le site est entièrement statique : pas de listing, pas de version serveur.
    autoindex off;
    server_tokens off;
}
