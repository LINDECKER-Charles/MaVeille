name: CI - Angular (réutilisable)

# Job CI partagé entre les pipelines test (dev) et prod (main).
# Build statique (SSG/prerender) : sortie web/dist/veille/browser/, pas de serveur Node.
on:
  workflow_call:
    inputs:
      artifact-name:
        description: "Nom de l'artefact contenant le build statique"
        required: false
        default: veille-dist
        type: string

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # App Angular à la racine repo : web/. Le générateur de données scanne Recap/ et
  # Categorie/ au build => checkout complet du repo (pas de sparse-checkout web/).
  FRONT_DIR: web

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ${{ env.FRONT_DIR }}/package-lock.json

      - name: Install dependencies
        working-directory: ${{ env.FRONT_DIR }}
        run: npm ci

      - name: Run linter
        working-directory: ${{ env.FRONT_DIR }}
        run: npm run lint --if-present

      # shell: bash => pipefail : l'échec de ng test fait échouer le step malgré le tee
      - name: Run unit tests + coverage
        working-directory: ${{ env.FRONT_DIR }}
        shell: bash
        run: npm test 2>&1 | tee karma.log

      - name: Publish test & coverage summary
        if: always()
        working-directory: ${{ env.FRONT_DIR }}
        run: >-
          node "$GITHUB_WORKSPACE/.github/scripts/test-summary.mjs"
          karma.log coverage/veille/coverage-summary.json
          >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: coverage-report
          path: ${{ env.FRONT_DIR }}/coverage
          if-no-files-found: ignore

      - name: Build Angular app (statique)
        working-directory: ${{ env.FRONT_DIR }}
        run: npm run build

      - name: Install Playwright browsers
        working-directory: ${{ env.FRONT_DIR }}
        run: npx playwright install --with-deps chromium

      - name: Run e2e tests (Playwright)
        working-directory: ${{ env.FRONT_DIR }}
        env:
          # Permet d'exclure des routes instables sur les runners GitHub si besoin.
          # Couverture complète conservée en local (npm run e2e sans la variable).
          E2E_EXCLUDE_ROUTES: ""
        run: npm run e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report
          path: ${{ env.FRONT_DIR }}/playwright-report
          if-no-files-found: ignore

      - name: Run Lighthouse CI
        working-directory: ${{ env.FRONT_DIR }}
        run: npm run lighthouse

      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: lighthouse-reports
          path: ${{ env.FRONT_DIR }}/.lighthouseci
          if-no-files-found: ignore

      # Artefact = uniquement le dossier statique servi par Apache (browser/).
      - name: Upload static build artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ inputs.artifact-name }}
          path: ${{ env.FRONT_DIR }}/dist/veille/browser
          if-no-files-found: error
