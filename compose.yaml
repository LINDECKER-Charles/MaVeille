# Environnement local — `docker compose up --build`, puis http://localhost:4200
#
# L'app est un site statique prérendu, sans backend : le conteneur la construit
# puis la sert avec nginx, en reprenant les en-têtes du vhost de production.
# Il n'y a donc pas de rechargement à chaud — après une modification du code ou
# de report/, relancer `docker compose up --build`.

services:
  web:
    build:
      # Contexte à la racine du dépôt : le générateur de données lit report/.
      context: .
      dockerfile: web/Dockerfile.dev
    # Service unique, sans dépendance réseau : on se branche sur le bridge par
    # défaut plutôt que de faire allouer un sous-réseau de plus à Docker.
    network_mode: bridge
    ports:
      - '4200:80'
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'wget', '--spider', '-q', 'http://127.0.0.1/']
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
